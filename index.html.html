
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus Time - 뽀모도로 타이머</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f5fb;
      color: #26324a;
    }

    .container {
      width: 100%;
      max-width: 430px;
      padding: 30px 24px;
      text-align: center;
      background: white;
      border-radius: 24px;
      box-shadow: 0 10px 35px rgba(38, 50, 74, 0.08);
    }

    h1 {
      margin: 0 0 8px;
    }

    .subtitle {
      color: #8790a4;
      margin-bottom: 28px;
    }

    .modes,
    .controls {
      display: flex;
      gap: 8px;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-size: 14px;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 2px solid #5878e5;
      outline-offset: 3px;
    }

    .mode {
      flex: 1;
      background: #f0f2f8;
      color: #4c5870;
    }

    .mode.active {
      background: #e3eaff;
      color: #4263c7;
      font-weight: bold;
    }

    #timer {
      margin: 24px 0;
      font-size: clamp(60px, 16vw, 82px);
      font-weight: bold;
      letter-spacing: -3px;
      font-variant-numeric: tabular-nums;
    }

    .progress {
      height: 8px;
      margin-bottom: 28px;
      overflow: hidden;
      background: #edf0f6;
      border-radius: 10px;
    }

    #bar {
      width: 100%;
      height: 100%;
      background: #6885ed;
      transition: width 0.2s;
    }

    .controls button {
      flex: 1;
      padding: 15px 8px;
      font-size: 16px;
    }

    #start {
      background: #5878e5;
      color: white;
    }

    #reset {
      background: #edf0f7;
      color: #48546b;
    }

    .stats {
      margin-top: 28px;
      padding: 18px;
      background: #f7f8fc;
      border-radius: 14px;
      color: #737f96;
    }

    .stats strong {
      display: block;
      margin-top: 6px;
      font-size: 25px;
      color: #4263c7;
    }

    .settings {
      margin-top: 24px;
      text-align: left;
    }

    .settings label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin: 13px 0;
      font-size: 14px;
    }

    .settings input {
      width: 85px;
      padding: 9px;
      border: 1px solid #dce1ed;
      border-radius: 8px;
      font-size: 15px;
    }

    #save {
      width: 100%;
      margin-top: 8px;
      background: #e7ebf8;
      color: #4263c7;
    }

    #status {
      min-height: 20px;
      margin-top: 14px;
      color: #737f96;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Focus Time</h1>
    <p class="subtitle">작은 집중이 큰 성장을 만듭니다.</p>

    <div class="modes" aria-label="타이머 모드">
      <button type="button" class="mode active" data-mode="study">
        공부
      </button>
      <button type="button" class="mode" data-mode="short">
        짧은 휴식
      </button>
      <button type="button" class="mode" data-mode="long">
        긴 휴식
      </button>
    </div>

    <div id="timer" role="timer" aria-label="남은 시간">
      25:00
    </div>

    <div
      class="progress"
      role="progressbar"
      aria-label="남은 시간 진행률"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-valuenow="100"
      id="progress"
    >
      <div id="bar"></div>
    </div>

    <div class="controls">
      <button type="button" id="start">▶ 시작</button>
      <button type="button" id="reset">↻ 초기화</button>
    </div>

    <div class="stats">
      완료한 공부 세션
      <strong><span id="sessions">0</span>회</strong>
    </div>

    <section class="settings">
      <h3>⚙️ 시간 설정 (분)</h3>

      <label for="studyTime">
        공부 시간
        <input id="studyTime" type="number"
          min="1" max="180" step="1" value="25">
      </label>

      <label for="shortTime">
        짧은 휴식
        <input id="shortTime" type="number"
          min="1" max="60" step="1" value="5">
      </label>

      <label for="longTime">
        긴 휴식
        <input id="longTime" type="number"
          min="1" max="120" step="1" value="15">
      </label>

      <button type="button" id="save">설정 적용</button>
    </section>

    <p id="status" role="status" aria-live="polite">
      공부할 준비가 되었어요.
    </p>
  </main>

  <script>
    "use strict";

    const timer = document.getElementById("timer");
    const bar = document.getElementById("bar");
    const progress = document.getElementById("progress");
    const startBtn = document.getElementById("start");
    const resetBtn = document.getElementById("reset");
    const sessionsText = document.getElementById("sessions");
    const status = document.getElementById("status");

    const inputs = {
      study: document.getElementById("studyTime"),
      short: document.getElementById("shortTime"),
      long: document.getElementById("longTime")
    };

    const modes = {
      study: 25,
      short: 5,
      long: 15
    };

    const modeNames = {
      study: "공부",
      short: "짧은 휴식",
      long: "긴 휴식"
    };

    let mode = "study";
    let totalSeconds = modes[mode] * 60;
    let remaining = totalSeconds;
    let running = false;
    let intervalId = null;
    let sessions = 0;
    let endTime = 0;

    function showTime() {
      const minutes = Math.floor(remaining / 60);
      const seconds = remaining % 60;

      timer.textContent =
        String(minutes).padStart(2, "0") + ":" +
        String(seconds).padStart(2, "0");

      const percent = totalSeconds > 0
        ? (remaining / totalSeconds) * 100
        : 0;

      bar.style.width = percent + "%";
      progress.setAttribute(
        "aria-valuenow",
        String(Math.round(percent))
      );

      document.title = timer.textContent + " | Focus Time";
    }

    function stopInterval() {
      if (intervalId !== null) {
        clearInterval(intervalId);
        intervalId = null;
      }

      running = false;
      startBtn.textContent = "▶ 시작";
    }

    function updateRemaining() {
      remaining = Math.max(
        0,
        Math.ceil((endTime - Date.now()) / 1000)
      );

      showTime();
    }

    function finishTimer() {
      stopInterval();
      remaining = 0;
      showTime();

      if (mode === "study") {
        sessions += 1;
        sessionsText.textContent = String(sessions);
        status.textContent = "공부 세션을 완료했어요!";
        alert("공부 완료! 수고했어요 🎉");
      } else {
        status.textContent = "휴식 시간이 끝났어요!";
        alert("휴식 완료! 다시 집중해 볼까요? 💪");
      }
    }

    function tick() {
      if (!running) return;

      updateRemaining();

      if (remaining <= 0) {
        finishTimer();
      }
    }

    function startTimer() {
      if (running) {
        // 일시정지할 때 실제 남은 시간을 먼저 계산
        updateRemaining();
        stopInterval();

        if (remaining <= 0) {
          finishTimer();
        } else {
          status.textContent = "타이머를 일시정지했어요.";
        }

        return;
      }

      // 완료된 타이머를 다시 시작하면 전체 시간으로 복원
      if (remaining <= 0) {
        remaining = totalSeconds;
      }

      running = true;
      endTime = Date.now() + remaining * 1000;

      startBtn.textContent = "⏸ 일시정지";
      status.textContent = modeNames[mode] + " 진행 중";

      // 이전 타이머가 중복 실행되지 않도록 보장
      if (intervalId !== null) {
        clearInterval(intervalId);
      }

      intervalId = setInterval(tick, 200);
      tick();
    }

    function selectMode(newMode) {
      if (!Object.prototype.hasOwnProperty.call(modes, newMode)) {
        return;
      }

      stopInterval();
      mode = newMode;
      totalSeconds = modes[mode] * 60;
      remaining = totalSeconds;

      document.querySelectorAll(".mode").forEach(button => {
        const selected = button.dataset.mode === mode;
        button.classList.toggle("active", selected);
        button.setAttribute("aria-pressed", String(selected));
      });

      status.textContent = modeNames[mode] + " 모드를 선택했어요.";
      showTime();
    }

    document.querySelectorAll(".mode").forEach(button => {
      button.setAttribute(
        "aria-pressed",
        String(button.dataset.mode === mode)
      );

      button.addEventListener("click", () => {
        selectMode(button.dataset.mode);
      });
    });

    startBtn.addEventListener("click", startTimer);

    resetBtn.addEventListener("click", () => {
      stopInterval();
      remaining = totalSeconds;
      status.textContent = "타이머를 초기화했어요.";
      showTime();
    });

    document.getElementById("save").addEventListener("click", () => {
      const limits = {
        study: 180,
        short: 60,
        long: 120
      };

      const newValues = {};

      for (const key of Object.keys(inputs)) {
        const rawValue = inputs[key].value.trim();
        const value = Number(rawValue);

        if (
          rawValue === "" ||
          !Number.isFinite(value) ||
          !Number.isInteger(value) ||
          value < 1 ||
          value > limits[key]
        ) {
          alert(
            modeNames[key] + " 시간은 1~" +
            limits[key] + " 사이의 정수로 입력해 주세요."
          );

          inputs[key].focus();
          return;
        }

        newValues[key] = value;
      }

      // 모든 입력이 유효할 때만 설정을 한꺼번에 변경
      Object.assign(modes, newValues);

      selectMode(mode);
      status.textContent = "시간 설정을 적용했어요.";
      alert("시간 설정이 적용되었습니다!");
    });

    showTime();
  </script>
</body>
</html>
